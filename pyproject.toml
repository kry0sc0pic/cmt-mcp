[project]
name = "cmt-mcp"
version = "0.1.0"
description = "Read-only MCP server for Microsoft CMT (Conference Management Toolkit) author data"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
cmt-mcp = "cmt_mcp.server:main"
cmt-mcp-register = "cmt_mcp.register:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cmt_mcp"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "playwright>=1.64.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
